name: Build Android APK (FleetOS Tech)

on:
  workflow_dispatch: # Déclenchement manuel en 1 clic
    inputs:
      server_url:
        description: "Origine chargée par l'APK, pour une APK de test (ex. http://192.168.1.20:5000). Vide : variable FLEETOS_APP_URL."
        required: false
        default: ""
  push:
    branches: [ main, master ]
    paths:
      - 'client/**'
      - 'shared/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'scripts/android-offline-page.ts'
      - 'scripts/android-smoke/**'
      - 'package.json'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    # ready_for_review : un brouillon passé en revue déclenche le build.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'client/**'
      - 'shared/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'scripts/android-offline-page.ts'
      - 'scripts/android-smoke/**'
      - 'package.json'
      - '.github/workflows/build-android-apk.yml'

# Lecture seule : le workflow ne publie que des artefacts de run.
permissions:
  contents: read

jobs:
  build-android:
    # Pas de build sur une PR brouillon (décision du 3 novembre 2026), comme ci.yml.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: 📱 Compiler l'APK Android
    runs-on: ubuntu-latest
    env:
      # Origine servie que l'APK charge (même origine que la PWA : cookies, /api, /ws sans CORS).
      # Variable de dépôt, pas un secret. Voir docs/deploiement/android-apk.md.
      CAP_SERVER_URL: ${{ inputs.server_url || vars.FLEETOS_APP_URL }}

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Configurer Node.js (v22)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Capacitor CLI 8 exige Node >= 22 (`npx cap sync android` échouait en v20).
          node-version: 22
          cache: 'npm'

      - name: ☕ Configurer Java JDK (v21)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          # Capacitor Android 8 compile en Java 21 (« invalid source release: 21 » avec le JDK 17).
          java-version: 21

      - name: 📦 Installer les dépendances NPM
        run: npm ci

      - name: 🔨 Compiler le client web (React / Vite)
        run: npm run build

      - name: 📴 Écrire la page hors ligne de l'APK
        run: |
          if [ -z "$CAP_SERVER_URL" ]; then
            echo "::warning::Variable FLEETOS_APP_URL absente : l'APK embarque le bundle local, qui appelle https://localhost/api et ne joint aucun serveur."
          fi
          npx tsx scripts/android-offline-page.ts

      - name: 🔄 Synchroniser avec Capacitor Android
        run: npx cap sync android

      # Preuve dans le journal : l'origine réellement embarquée dans l'APK.
      - name: 🔎 Afficher l'origine embarquée
        run: node -e 'const c=require("./android/app/src/main/assets/capacitor.config.json"); console.log("server:", JSON.stringify(c.server))'

      - name: ⚙️ Donner les permissions d'exécution à Gradle
        run: chmod +x android/gradlew

      # Jamais sur une PR : une branche non relue ne doit pas lire le keystore ni publier un APK signé.
      - name: 🔑 Préparer la signature (Keystore)
        id: check_keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$CAP_SERVER_URL" ]; then
              echo "::error::Keystore présent mais variable FLEETOS_APP_URL absente : une APK signée sur le bundle local ne joindrait aucun serveur. Poser FLEETOS_APP_URL (voir docs/deploiement/android-apk.md)."
              exit 1
            fi
            # Release : jamais de trafic en clair (cleartext n'est activé que pour une origine http).
            case "$CAP_SERVER_URL" in
              https://*) ;;
              *) echo "::error::APK signée : l'origine doit être en https (reçu une origine non https)."; exit 1 ;;
            esac
            echo "Keystore de signature détecté dans les secrets GitHub."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ Aucun keystore fourni dans les secrets GitHub."
            echo "Compilation en mode Debug stable (mises à jour garanties sans désinstallation)."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Compiler l'APK Release (Signé)
        if: github.event_name != 'pull_request' && steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: 🚀 Compiler l'APK Debug (Stable)
        if: steps.check_keystore.outputs.has_keystore != 'true'
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Publier l'APK Release Signé
        if: github.event_name != 'pull_request' && steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FleetOS-Tech-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 📤 Publier l'APK Debug Stable
        if: steps.check_keystore.outputs.has_keystore != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FleetOS-Tech-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # Preuve sur émulateur : l'APK charge une origine servie (serveur témoin sur l'hôte), le bridge
  # natif est injecté, /api, le cookie et /ws marchent en même origine, la page hors ligne s'affiche.
  smoke:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: 📱 Tester l'APK sur émulateur
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # localhost (renvoyé vers le serveur témoin par `adb reverse`) : contexte sécurisé, comme
      # l'origine https de prod. Une origine http://10.0.2.2 n'expose pas navigator.serviceWorker.
      CAP_SERVER_URL: http://localhost:8080

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Configurer Node.js (v22)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Configurer Java JDK (v21)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: 📦 Installer les dépendances NPM
        run: npm ci

      # Pas de build du client : l'APK charge le serveur témoin, seule la page hors ligne est embarquée.
      - name: 📴 Préparer le webDir et la page hors ligne
        run: |
          mkdir -p dist/public
          npx tsx scripts/android-offline-page.ts

      - name: 🔄 Synchroniser avec Capacitor Android
        run: npx cap sync android

      - name: 🔎 Afficher l'origine embarquée
        run: node -e 'const c=require("./android/app/src/main/assets/capacitor.config.json"); console.log("server:", JSON.stringify(c.server))'

      - name: 🚀 Compiler l'APK Debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: ⚡ Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🤖 Lancer l'APK sur émulateur
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/android-smoke/run.sh

      - name: 📤 Publier les preuves (rapport, captures, logcat)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FleetOS-Tech-Smoke
          path: android-smoke/
          retention-days: 14
