name: Déploiement recette (SSH)

# No-op tant que les secrets RECETTE_SSH_* n'existent pas.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-recette
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.RECETTE_SSH_HOST }}
      SSH_USER: ${{ secrets.RECETTE_SSH_USER }}
      SSH_KEY: ${{ secrets.RECETTE_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.RECETTE_SSH_KNOWN_HOSTS }}
      DEPLOY_DIR: ${{ vars.RECETTE_DEPLOY_DIR }}
    steps:
      - name: Secrets présents ?
        id: gate
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets RECETTE_SSH_* absents : déploiement ignoré."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mise à jour du VPS
        if: steps.gate.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          DIR="${DEPLOY_DIR:-fleet-management-and-erp}"
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "cd '$DIR' && git pull --ff-only && cd deploy && docker compose build app-recette && docker compose up -d app-recette"
